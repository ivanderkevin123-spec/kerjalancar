{{define "app"}}<!doctype html>
<html lang="id" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
  <title>{{.Title}} · KerjaLancar</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body class="min-h-full flex flex-col" hx-boost="true">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
      <a href="/app" class="flex items-center gap-2 font-semibold text-teal-700">
        <span class="inline-block h-6 w-6 rounded-md bg-teal-600"></span>
        <span id="workspace-name" class="truncate max-w-[12rem] sm:max-w-xs">{{.Workspace.Name}}</span>
      </a>
      <nav class="hidden sm:flex items-center gap-1 text-sm">
        {{template "navlinks" .}}
      </nav>
      <form method="post" action="/keluar" class="ml-2">
        <button type="submit" class="rounded-lg px-3 py-1.5 text-sm text-slate-600 hover:bg-slate-100">Keluar</button>
      </form>
    </div>
  </header>
  <main class="mx-auto w-full max-w-3xl flex-1 px-4 py-6 pb-24 sm:pb-6">
    {{template "flash" .}}
    {{template "content" .}}
  </main>
  <nav class="fixed inset-x-0 bottom-0 z-10 flex justify-around border-t border-slate-200 bg-white py-2 text-xs sm:hidden" aria-label="Navigasi utama">
    {{template "navlinks" .}}
  </nav>
</body>
</html>{{end}}

{{define "navlinks"}}
<a href="/app" class="rounded-lg px-3 py-1.5 {{if eq .Nav "beranda"}}bg-teal-50 text-teal-700 font-medium{{else}}text-slate-600 hover:bg-slate-100{{end}}">Beranda</a>
<a href="/app/follow-up" class="rounded-lg px-3 py-1.5 {{if eq .Nav "follow-up"}}bg-teal-50 text-teal-700 font-medium{{else}}text-slate-600 hover:bg-slate-100{{end}}">Follow-up</a>
<a href="/app/prospek" class="rounded-lg px-3 py-1.5 {{if eq .Nav "prospek"}}bg-teal-50 text-teal-700 font-medium{{else}}text-slate-600 hover:bg-slate-100{{end}}">Prospek</a>
<a href="/app/pelanggan" class="rounded-lg px-3 py-1.5 {{if eq .Nav "pelanggan"}}bg-teal-50 text-teal-700 font-medium{{else}}text-slate-600 hover:bg-slate-100{{end}}">Pelanggan</a>
<a href="/app/pengaturan" class="rounded-lg px-3 py-1.5 {{if eq .Nav "pengaturan"}}bg-teal-50 text-teal-700 font-medium{{else}}text-slate-600 hover:bg-slate-100{{end}}">Pengaturan</a>
{{end}}
